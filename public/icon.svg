<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Printable Card / Badge Graphic -->
  <g filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect x="96" y="116" width="320" height="280" rx="24" fill="#ffffff" />
    <!-- Header band of Card -->
    <path d="M96 140 C96 126.745 106.745 116 120 116 L392 116 C405.255 116 416 126.745 416 140 L416 180 L96 180 Z" fill="#1e40af" />
    
    <!-- Mini Logo Circle -->
    <circle cx="140" cy="148" r="14" fill="#facc15" />
    <!-- Header Text Lines -->
    <rect x="170" y="142" width="130" height="6" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="170" y="152" width="80" height="5" rx="2.5" fill="#93c5fd" />
    
    <!-- Student Avatar Box -->
    <rect x="126" y="210" width="76" height="96" rx="8" fill="#e2e8f0" />
    <circle cx="164" cy="242" r="16" fill="#3b82f6" />
    <path d="M140 294 C140 270 188 270 188 294 Z" fill="#3b82f6" />
    
    <!-- Student Info Lines -->
    <rect x="222" y="218" width="160" height="8" rx="4" fill="#1e293b" />
    <rect x="222" y="238" width="120" height="7" rx="3.5" fill="#64748b" />
    <rect x="222" y="256" width="140" height="7" rx="3.5" fill="#64748b" />
    <rect x="222" y="274" width="90" height="7" rx="3.5" fill="#64748b" />
    
    <!-- Mini Stamp Seal Graphic -->
    <circle cx="348" cy="334" r="26" fill="none" stroke="#4338ca" stroke-width="3" opacity="0.85" stroke-dasharray="4,2" />
    <circle cx="348" cy="334" r="18" fill="none" stroke="#4338ca" stroke-width="2" opacity="0.85" />
    <text x="348" y="338" font-family="sans-serif" font-size="8" font-weight="bold" fill="#4338ca" text-anchor="middle">LULUS</text>
  </g>
</svg>
